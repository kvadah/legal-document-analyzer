[project]
name = "legal-doc-analyzer-backend"
version = "0.1.0"
description = "Backend API and processing pipelines for the Legal Document Analyzer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
  # --- Web framework & server ---
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",        # multipart file uploads
  "sse-starlette>=2.1",             # SSE: pipeline status + RAG streaming

  # --- Config & validation ---
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.5",

  # --- Database (async SQLAlchemy + Postgres) ---
  "sqlalchemy[asyncio]>=2.0.35",
  "alembic>=1.13",
  "asyncpg>=0.29",

  # --- Cache / queue / workers ---
  "redis>=5.0",
  "arq>=0.26",

  # --- Auth & security ---
  "pyjwt>=2.9",
  "bcrypt>=4.0",                     # password hashing
  "python-magic>=0.4.27",            # MIME sniffing for upload validation (needs libmagic)

  # --- Vector DB & object storage ---
  "qdrant-client>=1.11",
  "aioboto3>=13.1",                 # async S3 / MinIO client (pulls boto3/botocore)
  "pypdf>=5.0",                     # PDF text extraction for ingestion

  # --- LLM providers (behind the LLMProvider abstraction) ---
  "anthropic>=0.34",
  "openai>=1.40",

  # --- HTTP, resilience ---
  "httpx>=0.27",                    # Gemini embeddings API + tests
  "tenacity>=9.0",                  # exponential backoff / retries
]

[project.optional-dependencies]
# OCR fallback for scanned PDFs. Required by the worker image; optional for
# API-only or frontend-focused dev (see MOCK_EMBEDDINGS/MOCK_LLM for a canned-response dev flow).
# System libs required: tesseract-ocr, poppler-utils, libmagic.
processing = [
  "pytesseract>=0.3.13",            # Tesseract OCR fallback
  "pdf2image>=1.17",                # PDF -> images for OCR (needs poppler-utils)
]

dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "aiosqlite>=0.20",
  "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Local dev with everything:  uv sync --extra dev --extra processing

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
ignore_missing_imports = true       # many OCR/ML libs ship no type stubs

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
